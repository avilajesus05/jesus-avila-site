<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

        <address class="contact" aria-label="Contacto">

          <span class="contact-separator" aria-hidden="true"></span>
          <a href="tel:+525527622249">+52 55 2762 2249<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8" /></svg></a>
        </address>
      </section>
      <div class="edge-glow" aria-hidden="true"></div>
    </main>
    <script src="./vendor/matter.min.js"></script>
    <script type="module" src="./shapes.js"></script>
